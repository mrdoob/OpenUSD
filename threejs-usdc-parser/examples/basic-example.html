<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USDC Loader Example</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 5px;
            max-width: 300px;
        }
        #info h2 {
            margin: 0 0 10px 0;
        }
        #stats {
            margin-top: 10px;
            font-size: 12px;
        }
        #controls {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 5px;
        }
        button {
            margin: 5px;
            padding: 8px 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="info">
        <h2>USDC Loader Demo</h2>
        <p>Load and display USDC files in Three.js</p>
        <div id="stats">
            <div>Prims: <span id="primCount">0</span></div>
            <div>Meshes: <span id="meshCount">0</span></div>
            <div>Lights: <span id="lightCount">0</span></div>
            <div>Materials: <span id="materialCount">0</span></div>
        </div>
    </div>

    <div id="controls">
        <input type="file" id="fileInput" accept=".usdc,.usdz" />
        <button id="resetCamera">Reset Camera</button>
        <button id="toggleWireframe">Toggle Wireframe</button>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { USDZLoader } from '../src/USDZLoader.js';

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(5, 5, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 10, 7.5);
        scene.add(directionalLight);

        // Grid helper
        const gridHelper = new THREE.GridHelper(10, 10);
        scene.add(gridHelper);

        // Axes helper
        const axesHelper = new THREE.AxesHelper(5);
        scene.add(axesHelper);

        // USD Loader
        const loader = new USDZLoader();
        let loadedModel = null;

        // File input handler
        document.getElementById('fileInput').addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                loadUSDFile(file);
            }
        });

        function loadUSDFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    // Remove previous model
                    if (loadedModel) {
                        scene.remove(loadedModel);
                        loadedModel.traverse((child) => {
                            if (child.geometry) child.geometry.dispose();
                            if (child.material) {
                                if (Array.isArray(child.material)) {
                                    child.material.forEach(m => m.dispose());
                                } else {
                                    child.material.dispose();
                                }
                            }
                        });
                    }

                    // Parse USD file
                    const arrayBuffer = e.target.result;
                    loadedModel = loader.parse(arrayBuffer, file.name);
                    scene.add(loadedModel);

                    // Update stats
                    updateStats(loadedModel);

                    // Frame the model
                    frameModel(loadedModel);

                    console.log('USD model loaded:', loadedModel);
                } catch (error) {
                    console.error('Error loading USD file:', error);
                    alert('Error loading USD file: ' + error.message);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function updateStats(model) {
            let primCount = 0;
            let meshCount = 0;
            let lightCount = 0;
            const materials = new Set();

            model.traverse((child) => {
                primCount++;
                if (child instanceof THREE.Mesh) {
                    meshCount++;
                    if (child.material) {
                        materials.add(child.material);
                    }
                } else if (child instanceof THREE.Light) {
                    lightCount++;
                }
            });

            document.getElementById('primCount').textContent = primCount;
            document.getElementById('meshCount').textContent = meshCount;
            document.getElementById('lightCount').textContent = lightCount;
            document.getElementById('materialCount').textContent = materials.size;
        }

        function frameModel(model) {
            const box = new THREE.Box3().setFromObject(model);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());

            const maxDim = Math.max(size.x, size.y, size.z);
            const fov = camera.fov * (Math.PI / 180);
            let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2));
            cameraZ *= 2; // Add some padding

            camera.position.set(center.x + cameraZ, center.y + cameraZ, center.z + cameraZ);
            camera.lookAt(center);

            controls.target.copy(center);
            controls.update();
        }

        // Reset camera button
        document.getElementById('resetCamera').addEventListener('click', () => {
            if (loadedModel) {
                frameModel(loadedModel);
            } else {
                camera.position.set(5, 5, 5);
                camera.lookAt(0, 0, 0);
                controls.target.set(0, 0, 0);
                controls.update();
            }
        });

        // Toggle wireframe button
        document.getElementById('toggleWireframe').addEventListener('click', () => {
            if (loadedModel) {
                loadedModel.traverse((child) => {
                    if (child instanceof THREE.Mesh && child.material) {
                        child.material.wireframe = !child.material.wireframe;
                    }
                });
            }
        });

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Load a default model if available (optional)
        // Uncomment and provide a path to test with a specific file
        // fetch('path/to/your/model.usdc')
        //     .then(response => response.arrayBuffer())
        //     .then(buffer => {
        //         loadedModel = loader.parse(buffer, 'default.usdc');
        //         scene.add(loadedModel);
        //         updateStats(loadedModel);
        //         frameModel(loadedModel);
        //     })
        //     .catch(err => console.error('Error loading default model:', err));
    </script>
</body>
</html>
